<!DOCTYPE html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin · Nani Nails</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:20px auto;padding:0 14px;color:#3d332d;background:#fffcf9}input,button{font:inherit;padding:9px;margin:4px 0;border:1px solid #e5d2c8;border-radius:8px}button{background:#94702a;color:#fff;border:0;cursor:pointer}ul{list-style:none;padding:0}li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #f1dfd9}small{color:#8a7b6e;display:block}.res{font-weight:600}</style>
<h2>Turnos · Nani Nails</h2>
<div id="login"><input id="pw" type="password" placeholder="Contraseña"> <button id="in">Entrar</button></div>
<div id="app" hidden>
<h3>Agregar horarios</h3>
<input id="f" type="date"> <input id="h" placeholder="09:00, 16:30, 19:00" size="24"> <button id="add">Agregar</button>
<p id="msg"></p><h3>Próximos turnos</h3><ul id="ul"></ul></div>
<script>
const $=i=>document.getElementById(i);let K=sessionStorage.getItem("k")||"";
const api=(m,q,b)=>fetch("/api/admin/turnos"+(q||""),{method:m,headers:{"x-admin-key":K,"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});
async function load(){const r=await api("GET");$("login").hidden=r.ok;$("app").hidden=!r.ok;if(!r.ok)return;
 const ul=$("ul");ul.textContent="";(await r.json()).forEach(t=>{const li=document.createElement("li"),d=document.createElement("div");
  d.textContent=`${t.fecha} · ${t.hora}`;const s=document.createElement("small");
  if(t.nombre){d.className="res";s.textContent=`${t.servicio} · ${t.nombre} · ${t.celular} · ${t.mail}`}else s.textContent="Libre";
  d.appendChild(s);li.appendChild(d);
  if(!t.nombre){const b=document.createElement("button");b.textContent="Quitar";b.onclick=async()=>{await api("DELETE","?id="+encodeURIComponent(t.id));load()};li.appendChild(b)}
  ul.appendChild(li)})}
$("in").onclick=()=>{K=$("pw").value;sessionStorage.setItem("k",K);load()};
$("add").onclick=async()=>{const horas=$("h").value.split(/[,\s]+/).filter(x=>/^\d{2}:\d{2}$/.test(x));
 const r=await api("POST","",{fecha:$("f").value,horas});$("msg").textContent=r.ok?"Horarios agregados":"Revisá fecha y horas (formato 09:00)";if(r.ok){$("h").value="";load()}};
load();
</script>
</html>
